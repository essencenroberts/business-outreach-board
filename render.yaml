# Render Blueprint: deploys the API (Node web service) and the frontend (static site).
# In Render: New → Blueprint → pick this repo. You'll be asked for the values marked sync: false.
services:
  - type: web
    name: business-outreach-board-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The frontend's URL, e.g. https://business-outreach-board.onrender.com
      - key: CLIENT_ORIGIN
        sync: false
      # Optional: turns on Find leads, AI quick-add and AI audits
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: business-outreach-board
    runtime: static
    rootDir: client
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's URL, e.g. https://business-outreach-board-api.onrender.com
      - key: VITE_API_URL
        sync: false
